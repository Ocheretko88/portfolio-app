openapi: 3.1.0
info:
  title: Portfolio API
  version: v1
  description: >
    Public API powering iryna-ocheretko's portfolio front end. This document is
    the single source of truth for the API↔App contract; the Angular app's
    TypeScript types are generated from it (see docs/CONTRACTS.md).
  license:
    name: MIT
servers:
  - url: https://portfolio-api-ldu9.onrender.com
    description: Production (Render)
  - url: http://localhost:8000
    description: Local development

paths:
  /up:
    get:
      operationId: healthCheck
      summary: Liveness health check
      tags: [system]
      responses:
        '200':
          description: Service is up

  /api/v1/resumes:
    get:
      operationId: getResume
      summary: Full CV payload
      tags: [resume]
      responses:
        '200':
          description: The resume
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Resume' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/xray/traces:
    get:
      operationId: getXrayTrace
      summary: Real request-lifecycle trace
      tags: [xray]
      responses:
        '200':
          description: Timed stages of processing a request
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trace' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/security-lab/sql-injections:
    post:
      operationId: demoSqlInjection
      summary: Simulated SQL-injection demonstration (nothing is executed)
      tags: [security-lab]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoInput' }
      responses:
        '200':
          description: Vulnerable vs hardened comparison
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SqlInjectionResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/security-lab/xss-attempts:
    post:
      operationId: demoXss
      summary: Simulated reflected-XSS demonstration (nothing is executed)
      tags: [security-lab]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoInput' }
      responses:
        '200':
          description: Vulnerable vs hardened comparison
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/XssResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/gym/exercises:
    get:
      operationId: listGymExercises
      summary: Seeded exercise catalog (filterable)
      tags: [gym]
      parameters:
        - name: muscle
          in: query
          required: false
          schema: { type: string }
          description: Filter by primary muscle (e.g. `chest`, `back`).
        - name: equipment
          in: query
          required: false
          schema: { type: string }
          description: Filter by equipment tag (e.g. `barbell`, `machine`).
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ExerciseCategory' }
      responses:
        '200':
          description: The exercise catalog, optionally filtered
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /api/v1/gym/sessions:
    get:
      operationId: listGymSessions
      summary: Paginated workout sessions (optionally date-ranged)
      tags: [gym]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Day-first date lower bound (inclusive).
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Day-first date upper bound (inclusive).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of workout sessions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkoutSession' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      operationId: createGymSession
      summary: Log a workout session with its set entries
      tags: [gym]
      security:
        - gymWriteToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: The created session (with server-computed PR flags)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutSession' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/gym/sessions/{id}:
    get:
      operationId: getGymSession
      summary: One workout session, with its set entries
      tags: [gym]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The workout session
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutSession' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/gym/stats/overview:
    get:
      operationId: getGymStatsOverview
      summary: Dashboard aggregates — volume, PRs, streak, frequency
      tags: [gym]
      responses:
        '200':
          description: Aggregate stats computed in SQL
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/StatsOverview' }
                  meta: { $ref: '#/components/schemas/Meta' }

components:
  securitySchemes:
    gymWriteToken:
      type: apiKey
      in: header
      name: X-Gym-Token
      description: >-
        Shared secret required on mutating /gym routes (ADR-0008). Reads are
        open. A missing or wrong value returns 401 in the standard error
        envelope.

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { $ref: '#/components/schemas/ApiError' }

  schemas:
    Meta:
      type: object
      required: [version, generatedAt]
      properties:
        version: { type: string, example: v1 }
        generatedAt: { type: string, format: date-time }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: ValidationException }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    DemoInput:
      type: object
      required: [input]
      properties:
        input: { type: string, maxLength: 500 }

    SocialLink:
      type: object
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string }
        handle: { type: string }
        icon: { type: string }

    Stat:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }

    SkillGroup:
      type: object
      required: [name, items]
      properties:
        name: { type: string }
        items:
          type: array
          items: { type: string }

    ExperienceRole:
      type: object
      required: [company, title, period, highlights, stack]
      properties:
        company: { type: string }
        title: { type: string }
        period: { type: string }
        track: { type: string }
        highlights:
          type: array
          items: { type: string }
        stack:
          type: array
          items: { type: string }

    EducationEntry:
      type: object
      required: [institution, qualification]
      properties:
        institution: { type: string }
        qualification: { type: string }
        period: { type: string }

    Certification:
      type: object
      required: [name, issuer, issued]
      properties:
        name: { type: string }
        issuer: { type: string }
        issued: { type: string }
        credentialUrl: { type: string }

    Profile:
      type: object
      required: [name, title, location, summary, email, links]
      properties:
        name: { type: string }
        title: { type: string }
        location: { type: string }
        summary: { type: string }
        email: { type: string }
        links:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }

    Resume:
      type: object
      required: [profile, stats, skillGroups, experience, education, certifications]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        stats:
          type: array
          items: { $ref: '#/components/schemas/Stat' }
        skillGroups:
          type: array
          items: { $ref: '#/components/schemas/SkillGroup' }
        experience:
          type: array
          items: { $ref: '#/components/schemas/ExperienceRole' }
        education:
          type: array
          items: { $ref: '#/components/schemas/EducationEntry' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/Certification' }

    TraceStage:
      type: object
      required: [key, label, durationMs]
      properties:
        key: { type: string }
        label: { type: string }
        durationMs: { type: number }

    Trace:
      type: object
      required: [stages, totalMs, payloadBytes]
      properties:
        stages:
          type: array
          items: { $ref: '#/components/schemas/TraceStage' }
        totalMs: { type: number }
        payloadBytes: { type: integer }

    SqlInjectionSide:
      type: object
      required: [query, explanation, breached]
      properties:
        query: { type: string }
        explanation: { type: string }
        breached: { type: boolean }
        simulatedRows:
          type: array
          items:
            type: object
            additionalProperties: true
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

    SqlInjectionResult:
      type: object
      required: [input, vulnerable, hardened]
      properties:
        input: { type: string }
        vulnerable: { $ref: '#/components/schemas/SqlInjectionSide' }
        hardened: { $ref: '#/components/schemas/SqlInjectionSide' }

    XssSide:
      type: object
      required: [rendered, explanation, executed]
      properties:
        rendered: { type: string }
        explanation: { type: string }
        executed: { type: boolean }
        csp: { type: string }

    XssResult:
      type: object
      required: [input, vulnerable, hardened]
      properties:
        input: { type: string }
        vulnerable: { $ref: '#/components/schemas/XssSide' }
        hardened: { $ref: '#/components/schemas/XssSide' }

    PaginationMeta:
      type: object
      required: [version, generatedAt, page, perPage, total, totalPages]
      properties:
        version: { type: string, example: v1 }
        generatedAt: { type: string, format: date-time }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ExerciseCategory:
      type: string
      enum: [compound, isolation, mobility, cardio]

    WeightUnit:
      type: string
      enum: [kg, lb]

    Exercise:
      type: object
      required: [id, name, slug, category, isBodyweight, defaultUnit]
      properties:
        id: { type: integer }
        name: { type: string, description: 'Ukrainian display name (athlete logs in Ukrainian).' }
        slug: { type: string }
        category: { $ref: '#/components/schemas/ExerciseCategory' }
        primaryMuscle: { type: [string, 'null'] }
        secondaryMuscles:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { type: string }
        isBodyweight: { type: boolean }
        defaultUnit: { $ref: '#/components/schemas/WeightUnit' }

    SetEntry:
      type: object
      required: [id, exerciseId, setNumber, weightGrams, perSide, isWarmup, isPr]
      properties:
        id: { type: integer }
        exerciseId: { type: integer }
        setNumber: { type: integer, minimum: 1 }
        reps: { type: [integer, 'null'], minimum: 0 }
        weightGrams:
          type: integer
          minimum: 0
          description: 'Canonical unit — integer grams, never a float (ADR-0007).'
        perSide: { type: boolean }
        rpe: { type: [number, 'null'], minimum: 0, maximum: 10 }
        tempo: { type: [string, 'null'], example: '3-1-1' }
        restSeconds: { type: [integer, 'null'], minimum: 0 }
        isWarmup: { type: boolean }
        isPr:
          type: boolean
          description: 'Computed server-side on write; never client-supplied.'
        notes:
          type: [string, 'null']
          description: 'The only free-text field on a set entry.'

    SetEntryInput:
      type: object
      required: [exerciseId, weightGrams]
      properties:
        exerciseId: { type: integer }
        setNumber: { type: integer, minimum: 1 }
        reps: { type: [integer, 'null'], minimum: 0 }
        weightGrams: { type: integer, minimum: 0 }
        perSide: { type: boolean, default: false }
        rpe: { type: [number, 'null'], minimum: 0, maximum: 10 }
        tempo: { type: [string, 'null'] }
        restSeconds: { type: [integer, 'null'], minimum: 0 }
        isWarmup: { type: boolean, default: false }
        notes: { type: [string, 'null'] }

    WorkoutSession:
      type: object
      required: [id, performedAt, sets]
      properties:
        id: { type: integer }
        performedAt: { type: string, format: date-time }
        title: { type: [string, 'null'] }
        cycleDay:
          type: [integer, 'null']
          minimum: 1
          description: 'День циклу — optional training-cycle day (ADR-0007).'
        durationMin: { type: [integer, 'null'], minimum: 0 }
        notes:
          type: [string, 'null']
          description: 'The only free-text field on a session.'
        sets:
          type: array
          items: { $ref: '#/components/schemas/SetEntry' }

    CreateSessionRequest:
      type: object
      required: [performedAt, sets]
      properties:
        performedAt: { type: string, format: date-time }
        title: { type: [string, 'null'] }
        cycleDay: { type: [integer, 'null'], minimum: 1 }
        durationMin: { type: [integer, 'null'], minimum: 0 }
        notes: { type: [string, 'null'] }
        sets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SetEntryInput' }

    StatsOverview:
      type: object
      required:
        [
          totalVolumeAllTimeGrams,
          totalVolumeThisWeekGrams,
          volumeDeltaPct,
          prCountThisMonth,
          currentStreakDays,
          sessionsThisWeek,
        ]
      properties:
        totalVolumeAllTimeGrams:
          type: integer
          description: 'SUM(reps * weight_grams) over all sets, all-time.'
        totalVolumeThisWeekGrams:
          type: integer
          description: 'SUM(reps * weight_grams) over all sets, current week.'
        volumeDeltaPct:
          type: number
          description: 'This week vs. previous week, percent change.'
        prCountThisMonth: { type: integer, minimum: 0 }
        currentStreakDays: { type: integer, minimum: 0 }
        sessionsThisWeek: { type: integer, minimum: 0 }
